[package]
name = "aero-execute-engine"
version = "0.2.0"
edition = "2021"
authors = ["amazing200guy1-a11y"]
description = "Sub-microsecond lock-free order execution engine with SIMD risk kernel"
license = "MIT"
keywords = ["trading", "fintech", "low-latency", "execution", "hft"]
categories = ["finance", "algorithms"]

[dependencies]
crossbeam = "0.8"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
log = "0.4"
env_logger = "0.11"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "execution_bench"
harness = false
